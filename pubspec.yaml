name: my_expenses
description: An app that helps you to keep track of your expenses.

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.3.9+86

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  csv: ^8.0.0
  darq: ^2.1.0
  device_info_plus: ^13.3.0
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  enum_to_string: ^2.2.1
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  file_picker: ^13.1.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_colorpicker: ^1.1.0
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.3.4
  flutter_timezone: ^5.1.1
  fluttertoast: ^10.0.2
  font_awesome_flutter: ^11.0.0
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  icloud_storage: ^2.2.0
  image_picker: ^1.2.4
  internet_connection_checker_plus: ^3.1.2
  json_annotation: ^4.12.0
  local_auth: ^3.0.2
  logger: ^2.8.0
  month_picker_dialog: ^6.7.3
  open_file: ^4.0.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  permission_handler: ^13.0.2
  photo_view: ^0.15.0
  rate_my_app: ^2.4.2
  responsive_builder: ^0.7.1
  shared_preferences: ^2.5.6
  sprintf: ^7.0.0
  steel_crypt: ^3.0.0+1
  transparent_image: ^2.0.1
  url_launcher: ^6.3.3
  version_tracker:
    git:
      url: https://github.com/Wolfteam/version_tracker.git
      ref: feature/allow-package-info-plus-10
  workmanager: ^0.10.10

dev_dependencies:
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  intl_utils: ^2.8.17
  json_serializable: ^6.14.1
  lint: ^2.14.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/cost.png"
  image_path_ios: "assets/images/ios.png"
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "assets/images/macos.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/cost.png
    - assets/fonts/OpenSans-Regular.ttf
    - assets/fonts/OpenSans-Bold.ttf
    - assets/fonts/OpenSans-Italic.ttf
    - assets/fonts/OpenSans-BoldItalic.ttf
  fonts:
    - family: CustomIcons
      fonts:
        - asset: assets/fonts/CustomIcons.ttf

flutter_intl:
  enabled: true
